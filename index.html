<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>文字型抜き</title>
<meta name="description" content="砂糖菓子に刻まれた文字を、割らないように針で切り抜くゲーム。">
<meta name="theme-color" content="#fff4ee">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23ffc9dc%27/%3E%3Cpath d=%27M20 22h24v20H20z%27 fill=%27none%27 stroke=%27%23a8506f%27 stroke-width=%275%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Zen+Maru+Gothic:wght@900&display=swap">
<style>
  :root{--ink:#5a3a48;--bg:#fff4ee;--pink:#ff8fb1;--pinkd:#e0608a;--card:#ffffff;--line:#f0cdd8;
    --jp:"M PLUS Rounded 1c","Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  html,body{height:100vh;height:100dvh}
  /* 画面の文章は文節の途中で改行しない。短いラベルは折り返さない */
  body{word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
  h1,h2,p,.msg{text-wrap:balance}
  .ph{display:inline-block}
  button,.tag,.chip,.nw{white-space:nowrap}
  button{font-family:var(--jp);cursor:pointer;touch-action:manipulation;color:var(--ink)}
  input{font-family:var(--jp);font-size:20px}

  /* 画面 */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;
    gap:14px;padding:20px 16px calc(72px + env(safe-area-inset-bottom));overflow:auto;touch-action:pan-y;text-align:center}
  .screen.on{display:flex}
  #scTitle h1{font-size:clamp(40px,12vw,76px);letter-spacing:.08em;line-height:1.2}
  #scTitle .lead{font-size:clamp(14px,3.8vw,18px);font-weight:700;opacity:.75;max-width:20em}
  #scTitle>*:not(canvas){position:relative;z-index:1}
  #tCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .stack{display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{border:0;border-radius:999px;padding:12px 28px;font-size:20px;font-weight:900;background:var(--pink);color:#fff;
    box-shadow:0 4px 0 var(--pinkd);min-width:150px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pinkd)}
  .btn.sub{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
  .btn.sm{font-size:15px;padding:8px 18px;min-width:0}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #scSelect h2{font-size:26px}
  .box{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 3px 0 var(--line);width:min(100%,420px);
    display:flex;flex-direction:column;gap:10px;align-items:center}
  .box h3{font-size:16px}
  #inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center;
    user-select:text;-webkit-user-select:text;color:var(--ink);background:#fffaf8}
  #selMsg{min-height:1.6em;color:#c0305c;font-weight:700;font-size:15px}

  /* 型抜き画面 */
  #scGame{position:absolute;inset:0;display:none;flex-direction:column}
  #scGame.on{display:flex}
  #hud{padding:10px 14px 4px;display:flex;flex-direction:column;gap:6px;flex:none}
  #hud .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900}
  #hud .big{font-size:22px}
  #hud .stars{color:#e8a200;letter-spacing:.1em}
  #hud .time{font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right}
  .gaugeRow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
  #gauge{flex:1;height:12px;border-radius:99px;background:#f3dfe5;overflow:hidden}
  #gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb870,#e0305c)}
  #stageWrap{position:relative;flex:1;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:none}
  #toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;text-align:center;
    background:rgba(90,58,72,.92);color:#fff;padding:8px 18px;border-radius:999px;font-weight:900;font-size:17px;
    opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.on{opacity:1}
  #toast.bad{background:rgba(200,40,80,.94)}

  /* 結果 */
  #scResult h2{font-size:26px}
  #rank{position:relative;display:inline-block;min-height:96px;font-size:96px;font-weight:900;line-height:1;color:var(--pinkd)}
  #rank.C{color:#8a98a8}#rank.fail{color:#c0305c;font-size:48px;min-height:48px}
  #rank.S{color:#ff5c93;text-shadow:0 0 16px rgba(255,205,80,.95),0 3px 0 #fff}
  #rank.pop{animation:rankPop .5s cubic-bezier(.2,.9,.3,1) both}
  #rank.S.pop{animation:rankPopS .75s cubic-bezier(.2,.9,.3,1) both}
  @keyframes rankPop{0%{transform:scale(.15);opacity:0}55%{transform:scale(1.22);opacity:1}78%{transform:scale(.94)}100%{transform:scale(1);opacity:1}}
  @keyframes rankPopS{0%{transform:scale(.1) rotate(-14deg);opacity:0}45%{transform:scale(1.5) rotate(5deg);opacity:1}65%{transform:scale(.9) rotate(-2deg)}82%{transform:scale(1.12)}100%{transform:scale(1) rotate(0);opacity:1}}
  .spark{position:absolute;left:50%;top:50%;font-size:24px;line-height:1;color:#ffc42e;pointer-events:none;
    animation:spark .9s ease-out both}
  @keyframes spark{0%{transform:translate(-50%,-50%) scale(0);opacity:1}60%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    #rank.pop,#rank.S.pop{animation:fadeIn .3s both}
    .spark{display:none}
  }

  /* 緊張感：ヒビが多いと画面の縁が暗くなる */
  #vig{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;
    background:radial-gradient(ellipse at center,rgba(40,0,20,0) 48%,rgba(40,0,20,.75) 100%)}
  /* ミュート */
  #mute{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;width:44px;height:44px;
    border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:900;line-height:1;
    box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;padding:0}
  #mute.off{color:#b9a4ad}
  #mute.off::after{content:"";position:absolute;width:30px;height:3px;background:#c0305c;border-radius:2px;transform:rotate(-45deg)}
  #score{font-size:34px;font-weight:900}
  .bd{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:16px;text-align:left}
  .bd b{text-align:right;font-variant-numeric:tabular-nums}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{background:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 var(--line);font-size:22px;font-weight:900}
  .chip small{font-size:13px;margin-left:6px;color:var(--pinkd)}
  .msg{font-size:16px;font-weight:700}
  #rBest{min-height:0;font-weight:900;font-size:18px;color:#d4366b}
  #rBest:empty{display:none}
  #rBest.new{animation:bestPop .6s cubic-bezier(.2,.9,.3,1) both}
  @keyframes bestPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){#rBest.new{animation:none}}

  /* あそびかた */
  #scHow h2,#scRec h2{font-size:26px}
  .how{width:min(100%,440px);display:flex;flex-direction:column;gap:10px;text-align:left}
  .how .it{background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:0 3px 0 var(--line);font-size:15px;font-weight:700;line-height:1.6}
  .how .it b{display:block;font-size:16px;color:var(--pinkd);font-weight:900}
  .zones{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .zone{border-radius:10px;padding:3px 10px;font-size:13px;font-weight:900;color:#fff}
  .zone.ok{background:#4aae7c}.zone.warn{background:#e8a200}.zone.ng{background:#d03a5f}

  /* きろく */
  .recSum{font-size:17px;font-weight:900}
  .recList{width:min(100%,440px);display:flex;flex-direction:column;gap:8px}
  .recRow{display:grid;grid-template-columns:2.2em 2.4em 1fr auto;align-items:center;gap:8px;background:var(--card);
    border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 var(--line);text-align:left;font-weight:900}
  .recRow .c{font-size:24px;text-align:center}
  .recRow .r{font-size:22px;color:var(--pinkd);text-align:center}
  .recRow .r.C{color:#8a98a8}.recRow .r.S{color:#ff5c93}
  .recRow .p{font-size:16px;font-variant-numeric:tabular-nums}
  .recRow .t{font-size:12px;opacity:.65;white-space:nowrap}
  .recNone{opacity:.7;font-weight:700}
  .conf{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:900;font-size:15px}
  .conf[hidden]{display:none}
  /* 横持ち（高さが小さい画面）はぎゅっと詰める */
  @media (max-height:480px){
    .screen{gap:8px;padding:10px 16px calc(60px + env(safe-area-inset-bottom))}
    #scTitle h1{font-size:clamp(34px,9vh,48px)}
    #scTitle .lead{max-width:none}
    #scTitle .stack{flex-direction:row}
    #scSelect h2,#scHow h2,#scRec h2,#scResult h2{font-size:20px}
    #rank{font-size:56px;min-height:56px}#rank.fail{font-size:36px;min-height:36px}
    #score{font-size:24px}
    .bd{font-size:14px;gap:2px 16px}
    .how{display:grid;grid-template-columns:1fr 1fr;width:min(100%,680px);gap:8px}
    .how .it{font-size:14px;padding:8px 12px}
  }
  #quitBox{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 70px)}
  #quitAsk{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.94);border-radius:999px;padding:4px 6px 4px 14px;
    box-shadow:0 3px 0 var(--line);font-weight:900;font-size:14px;border:2px solid var(--line)}
  #quitBox.ask #quitAsk{display:flex}
  #quitBox.ask #quit{display:none}
</style>
</head>
<body>
<div id="app">
  <button id="mute" type="button" aria-pressed="false" aria-label="音を消す">♪</button>
  <section class="screen" id="scTitle">
    <canvas id="tCv" aria-hidden="true"></canvas>
    <h1 id="ttl"></h1>
    <p class="lead" id="ttlLead"></p>
    <div class="stack">
      <button class="btn" id="bStart">あそぶ</button>
      <button class="btn sub" id="bHow">あそびかた</button>
    </div>
  </section>

  <section class="screen" id="scHow">
    <h2>あそびかた</h2>
    <div class="how">
      <div class="it"><b>針をうごかす</b><span class="auto">マウスや指で|針を動かして、|刻まれた溝を|なぞって切ろう。|スマホでは|針が指の少し上に|出るよ。</span></div>
      <div class="it"><b>溝・フチ・外</b><span class="auto">溝の中は安全。|フチはヒビが入り、|外に出ると|割れて失敗。</span>
        <div class="zones"><span class="zone ok nw">溝の中</span><span class="zone warn nw">フチ</span><span class="zone ng nw">外</span></div></div>
      <div class="it"><b>ヒビ</b><span class="auto">ヒビがたまって|満タンになると割れる。|速く動かしても|ヒビが入るよ。</span></div>
      <div class="it"><b>ゆっくり丁寧が正解</b><span class="auto">急ぐほど危ない。|針を離しても、|溝の上なら|また刺せる。|穴のフチも|切ろう。</span></div>
    </div>
    <div class="row"><button class="btn" id="bHowGo">もどる</button></div>
  </section>

  <section class="screen" id="scSelect">
    <h2>文字を選ぶ</h2>
    <div class="box">
      <h3>ランダム</h3>
      <div class="row">
        <button class="btn sm" data-lv="easy">かんたん</button>
        <button class="btn sm" data-lv="normal">ふつう</button>
        <button class="btn sm" data-lv="hard">むずかしい</button>
      </div>
    </div>
    <div class="box">
      <h3 class="auto">文字を入力|（1〜6 文字）</h3>
      <input id="inp" type="text" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="あ  など">
      <button class="btn sm" id="bGo">この言葉で挑戦</button>
    </div>
    <div id="selMsg" class="msg"></div>
    <div class="row">
      <button class="btn sub sm" id="bBackTitle">もどる</button>
      <button class="btn sub sm" id="bRec">きろく</button>
    </div>
  </section>

  <section class="screen" id="scRec">
    <h2>きろく</h2>
    <div class="recSum" id="recSum"></div>
    <div class="row">
      <button class="btn sub sm" id="bRecBack">もどる</button>
      <button class="btn sub sm" id="bRecReset">きろくを消す</button>
    </div>
    <div class="conf" id="recConf" hidden><span id="recAsk"></span><button class="btn sm" id="bRecYes">消す</button><button class="btn sub sm" id="bRecNo">やめる</button></div>
    <div class="recList" id="recList"></div>
  </section>

  <section id="scGame">
    <div id="hud">
      <div class="top">
        <span class="big nw" id="hCh"></span>
        <span class="stars nw" id="hStars"></span>
        <span class="time nw" id="hTime">0.0 秒</span>
      </div>
      <div class="gaugeRow"><span class="nw">ヒビ</span><div id="gauge"><i></i></div></div>
    </div>
    <div id="stageWrap">
      <canvas id="cv"></canvas>
      <div id="vig"></div>
      <div id="toast"></div>
      <div id="quitBox">
        <button class="btn sub sm" id="quit">やめる</button>
        <span id="quitAsk"><span class="nw">やめますか？</span><button class="btn sm" id="quitYes">やめる</button><button class="btn sub sm" id="quitNo">つづける</button></span>
      </div>
    </div>
  </section>

  <section class="screen" id="scResult">
    <h2 id="rTitle"></h2>
    <div id="rank"></div>
    <div id="score"></div>
    <div class="bd" id="rBd"></div>
    <div class="chips" id="rChips"></div>
    <div class="msg" id="rBest"></div>
    <div class="msg" id="rMsg"></div>
    <div class="row" id="rBtns"></div>
  </section>
</div>
<script>
"use strict";
// ===== 設定（数値はここに集約。単位は「砂糖菓子の半径 = 1」）=====
const CFG = {
  // --- 文字の形 ---
  maxChars: 6,                 // 自由入力の最大文字数
  glyph: {
    size: 360,                 // 型を作る非表示キャンバスの一辺(px)
    fontPx: 250,               // 文字の大きさ(px)
    weight: 900,
    stroke: 3,                 // 文字をさらに太く丸くする縁取り(px)
    families: ['"M PLUS Rounded 1c"', '"Zen Maru Gothic"', '"Hiragino Maru Gothic ProN"', '"Yu Gothic UI"', 'sans-serif'],
    fontTimeoutMs: 2500,
    minThickness: 0.12,        // 線の太さの平均がこれ未満の記号（♡☆ など細い線）は太くする
  },
  shape: {
    fit: 1.2,                  // 文字の長辺がこの長さになるよう拡縮
    spacing: 0.010,            // 輪郭を点に分ける間隔
    minArea: 0.0012,           // これより小さい成分（ノイズ・小さすぎる穴）は捨てる
    smoothPasses: 2,
  },
  // --- 難しさ ---
  difficulty: {
    // 点数 = 輪郭の長さ + 0.4*(輪郭の数-1) + 8*狭い部分の割合
    starAt: [4.5, 7.8, 10.5, 13.5],  // この値未満で★1,★2,★3,★4。以上は★5（Phase 3: 7→7.8, 10→10.5 に調整）
    maxScore: 16,              // これを超えると「難しすぎます」
    maxTight: 0.30,            // 溝がくっつく部分の割合の上限
    tightDist: 0.07,           // 輪郭どうしがこれより近いと「狭い」
    tightArc: 0.30,            // 同じ輪郭内ではこれ以上離れた部分だけを比べる
  },
  // --- 判定 ---
  safeHalf: 0.035,             // 溝の中（安全）の半幅
  edgeHalf: 0.065,             // フチ（ヒビ）の半幅。これを超えると割れる
  cutR: 0.05,                  // 針が近くを通った点を「切れた」にする距離
  minSafePx: 6,                // 画面が小さいときも安全の半幅を最低このpxにする
  stepLen: 0.008,              // 判定の細かい区切り
  crackRate: 1.5,              // フチを 1.0 の長さ進むとヒビがいくつ増えるか
  speedLimit: 3.2,             // これ(半径/秒)を超えるとヒビ
  speedCrack: 0.5,             // 速度超過のヒビの増え方
  joinFrac: 0.98,              // 輪郭の何割切れたらつながったとみなすか
  hintFrac: 0.10,              // 切り残しがこの割合以下なら光らせる
  // --- 針 ---
  touchOffsetPx: 56,           // スマホで針を指の上にずらす量(px)
  // --- スコア ---
  score: {
    wAccuracy: 400, wCrack: 300, wSpeed: 300,
    mult: [0.6, 0.7, 0.8, 0.9, 1.0],         // 難しさ★1〜5の倍率
    rank: { S: 930, A: 850, B: 700 },        // 倍率をかける前の点数で判定（Phase 3 で調整）
    targetBase: 3, targetPerLen: 0.8,        // 目安時間(秒) = base + len*perLen（Phase 3 で調整）
  },
  // --- ランダム候補 ---
  pools: {
    // Phase 3: 全候補を実際に生成して「型にできる・理論上クリアできる・難しさ帯に収まる」を確認済み（verify.html が毎回再確認する）
    easy: ['一','二','十','口','人','大','小','山','工','土','上','下','L','O','I','T','U','C','H','E','ー','ト','ノ','レ','ニ','コ','ロ','く','し','て','こ'],
    normal: ['あ','い','う','え','お','か','き','け','さ','す','せ','そ','た','ち','つ','と','な','に','ぬ','ね','の','は','ひ','ふ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','わ','を','ん','ア','カ','キ','サ','ス','ネ','ミ','ヤ','ラ','木','水','火','花','月','森','犬','田','三','日','川'],
    hard: ['魚','蝶','優','願','観','器','織','雨','海','空','緑','桜','梅','蛇','熱','銀','館','鏡','歌','顔','数','楽','様','漢','鬼','盾','竜','虎','狼','蛍','鈴','琴','笛','旗','鍵','錠','験','番','線','細','結','緒','綺','繭','葉','蓮','藤','鮎','鱗','蟹','蛙','蜜','魂','華','橙'],
  },
  bands: { easy: [1, 2], normal: [2, 3], hard: [4, 5] },
};

// ===== ロジック（DOM に依存しない純関数。verify.html からも呼ぶ）=====
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- 入力の検査 ----------
const EMOJI_RE = /\p{Emoji_Presentation}|\p{Emoji_Modifier}|[\u{1F1E6}-\u{1F1FF}]|‍|️|⃣/u;
function validateInput(str) {
  const chars = [];
  for (const c of Array.from(String(str == null ? '' : str))) {
    if (/\s/u.test(c) || c === '　' || c === '​' || c === '﻿') continue;   // 空白は無視
    chars.push(c);
  }
  if (!chars.length) return { ok: false, chars, msg: '文字を入力してください' };
  for (const c of chars) {
    if (EMOJI_RE.test(c)) return { ok: false, chars, bad: c, msg: 'この文字は型にできません：「' + c + '」' };
  }
  if (chars.length > CFG.maxChars) return { ok: false, chars, msg: '文字は' + CFG.maxChars + '文字までです' };
  return { ok: true, chars };
}

// ---------- 輪郭の取り出し（マーチングスクエア）----------
// f: 0..1 の濃さ（W*H）。しきい値 th の等値線を閉じた折れ線の配列として返す（座標は格子の添字）
function marchLoops(f, W, H, th) {
  const WH = W * H;
  const adj = new Map();
  const link = (a, b) => {
    let A = adj.get(a); if (!A) adj.set(a, A = []); A.push(b);
    let B = adj.get(b); if (!B) adj.set(b, B = []); B.push(a);
  };
  for (let y = 0; y < H - 1; y++) {
    for (let x = 0; x < W - 1; x++) {
      const i = y * W + x;
      const v0 = f[i], v1 = f[i + 1], v2 = f[i + W + 1], v3 = f[i + W];
      const c0 = v0 >= th, c1 = v1 >= th, c2 = v2 >= th, c3 = v3 >= th;
      if (c0 === c1 && c1 === c2 && c2 === c3) continue;
      const E = [];                      // 上, 右, 下, 左 の順に、交差する辺の id
      const eids = [i, WH + y * W + x + 1, (y + 1) * W + x, WH + y * W + x];
      const cr = [c0 !== c1, c1 !== c2, c3 !== c2, c0 !== c3];
      const cs = [c0, c1, c2, c3];
      let cnt = 0;
      for (let k = 0; k < 4; k++) if (cr[k]) { E.push(k); cnt++; }
      if (cnt === 2) link(eids[E[0]], eids[E[1]]);
      else if (cnt === 4) {
        const center = (v0 + v1 + v2 + v3) / 4 >= th;
        for (let k = 0; k < 4; k++) {
          // 角 k は 辺(k+3)%4 と 辺 k の間にある
          if (cs[k] !== center) link(eids[(k + 3) % 4], eids[k]);
        }
      }
    }
  }
  const ptOf = id => {
    if (id < WH) {
      const y = (id / W) | 0, x = id - y * W;
      const a = f[y * W + x], b = f[y * W + x + 1];
      const t = (th - a) / (b - a);
      return [x + t, y];
    }
    id -= WH;
    const y = (id / W) | 0, x = id - y * W;
    const a = f[y * W + x], b = f[(y + 1) * W + x];
    const t = (th - a) / (b - a);
    return [x, y + t];
  };
  const seen = new Set();
  const loops = [];
  for (const start of adj.keys()) {
    if (seen.has(start)) continue;
    const loop = [];
    let prev = -1, cur = start;
    while (cur !== undefined && !seen.has(cur)) {
      seen.add(cur);
      loop.push(ptOf(cur));
      const nb = adj.get(cur);
      let nxt = nb[0] !== prev ? nb[0] : nb[1];
      if (nb.length === 2 && nb[0] === prev && nb[1] === prev) nxt = undefined;
      prev = cur; cur = nxt;
    }
    if (loop.length >= 6) loops.push(loop);
  }
  return loops;
}

function resampleClosed(P, ds) {
  const n = P.length, cum = [0];
  for (let i = 0; i < n; i++) {
    const a = P[i], b = P[(i + 1) % n];
    cum.push(cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1]));
  }
  const L = cum[n], m = Math.max(12, Math.round(L / ds)), out = [];
  let k = 0;
  for (let s = 0; s < m; s++) {
    const t = s * L / m;
    while (k < n - 1 && cum[k + 1] < t) k++;
    const seg = cum[k + 1] - cum[k], u = seg > 0 ? (t - cum[k]) / seg : 0;
    const a = P[k], b = P[(k + 1) % n];
    out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]);
  }
  return out;
}
function smoothClosed(P, passes) {
  let cur = P;
  for (let p = 0; p < passes; p++) {
    const n = cur.length, nx = new Array(n);
    for (let i = 0; i < n; i++) {
      const a = cur[(i + n - 1) % n], b = cur[i], c = cur[(i + 1) % n];
      nx[i] = [(a[0] + 2 * b[0] + c[0]) / 4, (a[1] + 2 * b[1] + c[1]) / 4];
    }
    cur = nx;
  }
  return cur;
}
function polyArea(P) {
  let s = 0; const n = P.length;
  for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; s += a[0] * b[1] - b[0] * a[1]; }
  return Math.abs(s) / 2;
}
function polyLen(P) {
  let s = 0; const n = P.length;
  for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; s += Math.hypot(b[0] - a[0], b[1] - a[1]); }
  return s;
}
function pointInPoly(x, y, P) {
  let inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const a = P[i], b = P[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
  }
  return inside;
}

// 白黒（0..1 の濃さ）の画像から、部品・輪郭を持つ「型」を作る
// 戻り値: { ok, parts:[{loops:[{pts:Float32Array,n,hole,len,area}]}], loops:[...], length, nParts, nHoles, ... }
function buildShape(mask, W, H, opt) {
  const S = Object.assign({}, CFG.shape, opt || {});
  const f = new Float32Array(W * H);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    f[i] = (mask[i - W - 1] + mask[i - W] + mask[i - W + 1] + mask[i - 1] + mask[i] + mask[i + 1] + mask[i + W - 1] + mask[i + W] + mask[i + W + 1]) / 9;
  }
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (mask[y * W + x] >= 0.5) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < x0) return { ok: false, reason: 'empty' };
  const k = S.fit / Math.max(x1 - x0 + 1, y1 - y0 + 1);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const raw = marchLoops(f, W, H, 0.5);
  let loops = [];
  let droppedNoise = 0;
  for (const r of raw) {
    let P = r.map(p => [(p[0] - cx) * k, (p[1] - cy) * k]);
    P = resampleClosed(P, S.spacing);
    P = smoothClosed(P, S.smoothPasses);
    const area = polyArea(P);
    if (area < S.minArea) { droppedNoise++; continue; }
    loops.push({ P, area, len: polyLen(P) });
  }
  loops.sort((a, b) => b.area - a.area);
  // 入れ子の深さで 外周(偶数) と 穴(奇数) を分ける
  for (let i = 0; i < loops.length; i++) {
    const L = loops[i];
    L.parent = -1; L.depth = 0;
    for (let j = 0; j < i; j++) {
      if (pointInPoly(L.P[0][0], L.P[0][1], loops[j].P)) { L.depth++; L.parent = j; }   // 面積の降順なので最後に当たった j が最も内側
    }
    L.hole = (L.depth % 2) === 1;
  }
  const parts = [], flat = [];
  const partOf = new Map();
  for (let i = 0; i < loops.length; i++) {
    if (loops[i].hole) continue;
    partOf.set(i, parts.length);
    parts.push({ loops: [] });
  }
  for (let i = 0; i < loops.length; i++) {
    const L = loops[i];
    const pi = L.hole ? partOf.get(L.parent) : partOf.get(i);
    if (pi === undefined) continue;
    const n = L.P.length, pts = new Float32Array(n * 2);
    for (let q = 0; q < n; q++) { pts[2 * q] = L.P[q][0]; pts[2 * q + 1] = L.P[q][1]; }
    const lp = { pts, n, hole: L.hole, len: L.len, area: L.area, part: pi, id: flat.length };
    parts[pi].loops.push(lp);
    flat.push(lp);
  }
  // 外周を先頭に
  for (const p of parts) p.loops.sort((a, b) => (a.hole ? 1 : 0) - (b.hole ? 1 : 0));
  let length = 0, nHoles = 0;
  for (const l of flat) { length += l.len; if (l.hole) nHoles++; }
  let ink = 0;
  for (const p of parts) for (const l of p.loops) ink += l.hole ? -l.area : l.area;
  const thickness = length > 0 ? 2 * ink / length : 0;     // 線の太さの平均（面積 ≒ 太さ × 中心線の長さ、輪郭長 ≒ 中心線の2倍）
  const shape = { ok: true, parts, loops: flat, length, thickness, nParts: parts.length, nHoles, nLoops: flat.length, droppedNoise, spacing: S.spacing };
  rateShape(shape);
  return shape;
}

// 難しさ★1〜5 と「難しすぎる」の判定
function rateShape(shape) {
  const D = CFG.difficulty;
  const cell = D.tightDist;
  const grid = new Map();
  const key = (a, b) => (a + 4096) * 8192 + (b + 4096);
  const all = [];
  for (const l of shape.loops) {
    for (let i = 0; i < l.n; i++) {
      const x = l.pts[2 * i], y = l.pts[2 * i + 1];
      const gx = Math.floor(x / cell), gy = Math.floor(y / cell), kk = key(gx, gy);
      let a = grid.get(kk); if (!a) grid.set(kk, a = []);
      const rec = { x, y, l, i };
      a.push(rec); all.push(rec);
    }
  }
  let tight = 0;
  const d2 = D.tightDist * D.tightDist;
  for (const p of all) {
    const gx = Math.floor(p.x / cell), gy = Math.floor(p.y / cell);
    let hit = false;
    for (let dx = -1; dx <= 1 && !hit; dx++) for (let dy = -1; dy <= 1 && !hit; dy++) {
      const a = grid.get(key(gx + dx, gy + dy));
      if (!a) continue;
      for (const q of a) {
        const ddx = q.x - p.x, ddy = q.y - p.y;
        if (ddx * ddx + ddy * ddy >= d2) continue;
        if (q.l !== p.l) { hit = true; break; }
        let sep = Math.abs(q.i - p.i); sep = Math.min(sep, p.l.n - sep);
        if (sep * (p.l.len / p.l.n) > D.tightArc) { hit = true; break; }
      }
    }
    if (hit) tight++;
  }
  shape.tight = all.length ? tight / all.length : 0;
  shape.difficultyScore = shape.length + 0.4 * Math.max(0, shape.nLoops - 1) + 8 * shape.tight;
  let stars = 5;
  for (let i = 0; i < D.starAt.length; i++) if (shape.difficultyScore < D.starAt[i]) { stars = i + 1; break; }
  shape.stars = stars;
  shape.tooHard = shape.difficultyScore > D.maxScore || shape.tight > D.maxTight;
  return shape;
}

// ---------- 判定の数値（画面の大きさで溝の幅を決める）----------
function judgeParams(R) {
  const k = Math.max(1, CFG.minSafePx / (CFG.safeHalf * (R || 180)));
  return {
    safe: CFG.safeHalf * k, edge: CFG.edgeHalf * k, cutR: CFG.cutR * k,
    step: CFG.stepLen, crackRate: CFG.crackRate, speedLimit: CFG.speedLimit,
    speedCrack: CFG.speedCrack, joinFrac: CFG.joinFrac, hintFrac: CFG.hintFrac,
  };
}

// ---------- 型抜きの進行（針の判定・切り抜き）----------
// 使い方: d.down(x,y) → {ok,msg} / d.move(x,y,dt) → イベント配列 / d.up()
function newDig(shape, P) {
  P = P || judgeParams(180);
  const loops = shape.loops;
  const cell = Math.max(P.edge, P.cutR);
  const grid = new Map();
  const key = (a, b) => (a + 4096) * 8192 + (b + 4096);
  const gx = [], gy = [], gl = [], gi = [];
  for (const l of loops) {
    for (let i = 0; i < l.n; i++) {
      const id = gx.length;
      const x = l.pts[2 * i], y = l.pts[2 * i + 1];
      gx.push(x); gy.push(y); gl.push(l.id); gi.push(i);
      const kk = key(Math.floor(x / cell), Math.floor(y / cell));
      let a = grid.get(kk); if (!a) grid.set(kk, a = []);
      a.push(id);
    }
  }
  const cut = loops.map(l => new Uint8Array(l.n));
  const cutCount = loops.map(() => 0);
  const joined = loops.map(() => false);
  const partDone = shape.parts.map(() => false);
  const d = {
    shape, P, cut, cutCount, joined, partDone,
    down: false, started: false, failed: false, failWhy: null, failPos: null, cleared: false,
    crack: 0, t: 0, accSum: 0, accN: 0, lx: 0, ly: 0, ema: 0, lastMsg: '',
    distance: 0,
  };
  const nearest = (x, y) => {
    const cxi = Math.floor(x / cell), cyi = Math.floor(y / cell);
    let best = -1, bd = Infinity;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const arr = grid.get(key(cxi + a, cyi + b));
      if (!arr) continue;
      for (const id of arr) {
        const dx = gx[id] - x, dy = gy[id] - y, dd = dx * dx + dy * dy;
        if (dd < bd) { bd = dd; best = id; }
      }
    }
    return { id: best, d: best < 0 ? Infinity : Math.sqrt(bd) };
  };
  d.nearest = nearest;

  function cutAround(x, y, loopId, ev) {
    const cxi = Math.floor(x / cell), cyi = Math.floor(y / cell);
    const r2 = P.cutR * P.cutR;
    let changed = false;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const arr = grid.get(key(cxi + a, cyi + b));
      if (!arr) continue;
      for (const id of arr) {
        if (gl[id] !== loopId) continue;
        const i = gi[id];
        if (cut[loopId][i]) continue;
        const dx = gx[id] - x, dy = gy[id] - y;
        if (dx * dx + dy * dy <= r2) { cut[loopId][i] = 1; cutCount[loopId]++; changed = true; }
      }
    }
    if (changed && !joined[loopId] && cutCount[loopId] >= Math.ceil(P.joinFrac * loops[loopId].n)) {
      joined[loopId] = true;
      const pi = loops[loopId].part;
      if (!partDone[pi] && shape.parts[pi].loops.every(l => joined[l.id])) {
        partDone[pi] = true;
        ev.push({ type: 'part', index: pi });
        if (partDone.every(Boolean)) { d.cleared = true; d.down = false; ev.push({ type: 'clear' }); }
      }
    }
  }
  function fail(why, x, y, ev) {
    d.failed = true; d.failWhy = why; d.failPos = { x, y }; d.down = false;
    ev.push({ type: 'fail', why });
  }
  // 針を刺す（置き直し）。溝の上（フチまで）でだけ受け付ける
  d.down_ = null;
  d.press = function (x, y) {
    if (d.failed || d.cleared) return { ok: false, msg: '' };
    const n = nearest(x, y);
    if (n.d > P.edge) { d.lastMsg = 'ここには刺せない'; return { ok: false, msg: 'ここには刺せない' }; }
    d.down = true; d.started = true; d.lx = x; d.ly = y; d.ema = 0;
    const ev = [];
    cutAround(x, y, gl[n.id], ev);
    return { ok: true, msg: '', events: ev };
  };
  d.release = function () { d.down = false; };
  // 針を動かす。前回位置から今回位置までを細かく区切って全部判定する
  d.move = function (x, y, dt) {
    const ev = [];
    if (!d.down || d.failed || d.cleared) return ev;
    const dx = x - d.lx, dy = y - d.ly, len = Math.hypot(dx, dy);
    const n = Math.max(1, Math.ceil(len / P.step));
    const sl = len / n;
    if (dt > 0 && len > 0) {
      const sp = len / dt;
      d.ema = d.ema === 0 ? sp : d.ema * 0.6 + sp * 0.4;
    }
    d.distance += len;
    for (let i = 1; i <= n; i++) {
      const sx = d.lx + dx * i / n, sy = d.ly + dy * i / n;
      const r = nearest(sx, sy);
      if (r.d > P.edge) { fail('out', sx, sy, ev); return ev; }          // 溝の外: その瞬間に割れる
      if (r.d > P.safe) {                                                 // フチ: ヒビが増える
        const tt = (r.d - P.safe) / (P.edge - P.safe);
        d.crack += sl * P.crackRate * (0.35 + 0.65 * tt);
      }
      d.accSum += r.d; d.accN++;
      if (d.crack >= 1) { d.crack = 1; fail('crack', sx, sy, ev); return ev; }
      cutAround(sx, sy, gl[r.id], ev);
      if (d.cleared) break;
    }
    if (!d.failed && dt > 0 && d.ema > P.speedLimit) {                    // 速すぎ: ヒビ
      d.crack += (d.ema / P.speedLimit - 1) * dt * P.speedCrack;
      if (d.crack >= 1) { d.crack = 1; fail('crack', x, y, ev); return ev; }
    }
    d.lx = x; d.ly = y;
    return ev;
  };
  // 切り残しの場所（残りわずかなときだけ）
  d.hints = function () {
    let total = 0, rest = 0;
    for (const l of loops) { total += l.n; if (!joined[l.id]) rest += l.n - cutCount[l.id]; }
    if (!total || rest === 0 || rest / total > P.hintFrac) return [];
    const out = [];
    for (const l of loops) {
      if (joined[l.id]) continue;
      for (let i = 0; i < l.n; i += 1) if (!cut[l.id][i]) out.push([l.pts[2 * i], l.pts[2 * i + 1]]);
    }
    return out;
  };
  d.progress = function () {
    let total = 0, c = 0;
    for (const l of loops) { total += l.n; c += cutCount[l.id]; }
    return total ? c / total : 0;
  };
  return d;
}

// ---------- スコア ----------
function targetTime(shape) { return CFG.score.targetBase + shape.length * CFG.score.targetPerLen; }
function scoreDig(dig, shape, P) {
  P = P || dig.P;
  const S = CFG.score;
  const meanD = dig.accN ? dig.accSum / dig.accN : P.edge;
  const acc = clamp(1 - meanD / P.edge, 0, 1);
  const crk = clamp(1 - dig.crack, 0, 1);
  const tg = targetTime(shape);
  const spd = dig.t <= tg ? 1 : clamp(1 - (dig.t - tg) / (tg * 2), 0, 1);
  const pa = Math.round(S.wAccuracy * acc), pc = Math.round(S.wCrack * crk), ps = Math.round(S.wSpeed * spd);
  const base = pa + pc + ps;
  const mult = S.mult[clamp(shape.stars, 1, 5) - 1];
  const total = Math.round(base * mult);
  const rank = base >= S.rank.S ? 'S' : base >= S.rank.A ? 'A' : base >= S.rank.B ? 'B' : 'C';
  return { acc, crk, spd, pa, pc, ps, base, mult, total, rank, time: dig.t, target: tg, meanD };
}

// ===== 演出の純ロジック（DOM に依存しない。verify.html からも呼ぶ）=====
const FX = {
  crackStep: 0.09,        // ヒビゲージがこれ増えるごとに新しいヒビが 1 本伸びる
  crackMax: 22,           // 菓子の上のヒビの最大本数
  heartFrom: 0.3,         // ヒビゲージがこれ以上で心音が鳴り始める
  heartSlow: 1.15,        // 心音の間隔(秒)：鳴り始め
  heartFast: 0.38,        // 心音の間隔(秒)：ゲージ満タン
  vigFrom: 0.25,          // ビネットが出始めるゲージ
  vigMax: 0.5,            // ゲージ満タン時のビネットの濃さ
  liftSec: 0.4,           // 部品が浮き上がる時間
  shatterAt: 0.3,         // 失敗：割れ目が走る時間（その後かけらが落ちる）
  shakeSec: 0.3,          // 画面の揺れの長さ
  shakePx: 8,             // 画面の揺れの大きさ(px)
  shakePxReduced: 1.5,
  gravity: 3.2,           // かけらの落ちる加速度（半径/秒²）
  shards: 11,             // かけらの数
  powder: 36,             // 部品 1 つが外れたときの粉の数
  powderReduced: 10,
  failMs: 1300,           // 失敗：結果画面までの時間(ms)
  clearMs: 1000,          // 成功：結果画面までの時間(ms)
};

function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function reducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (_) { return false; }
}

// ---------- ヒビ（折れ線）----------
function crackWalk(r, x, y, a, segs, segLen, jitter) {
  const pts = [[x, y]];
  for (let i = 0; i < segs; i++) {
    a += (r() - 0.5) * jitter;
    const l = segLen * (0.7 + r() * 0.6);
    x += Math.cos(a) * l; y += Math.sin(a) * l;
    pts.push([x, y]);
  }
  return { pts, a };
}
function newCrackSet(seed) { return { rng: rnd((seed * 7 + 13) >>> 0), items: [], burst: [], next: FX.crackStep }; }
function spawnCrack(set, x, y, gauge) {
  const r = set.rng;
  const a0 = r() * 6.2832;
  const segLen = 0.05 + gauge * 0.11;
  const segs = 4 + Math.floor(r() * 3);
  const main = crackWalk(r, x, y, a0, segs, segLen, 1.0);
  const branches = [];
  const nb = (r() < 0.55 + gauge * 0.35 ? 1 : 0) + (gauge > 0.6 && r() < 0.5 ? 1 : 0);
  for (let b = 0; b < nb; b++) {
    const k = 1 + Math.floor(r() * (segs - 1)), p = main.pts[k];
    const side = r() < 0.5 ? -1 : 1;
    branches.push(crackWalk(r, p[0], p[1], a0 + side * (0.5 + r() * 0.6), 2 + Math.floor(r() * 2), segLen * 0.7, 1.0).pts);
  }
  set.items.push({ pts: main.pts, branches, g0: gauge });
}
// ゲージが増えた分だけヒビを足す。足した本数を返す
function crackUpdate(set, x, y, gauge) {
  let added = 0;
  while (gauge >= set.next && set.items.length < FX.crackMax) {
    spawnCrack(set, x, y, gauge); set.next += FX.crackStep; added++;
  }
  return added;
}
// そのヒビがどこまで伸びたか(0..1)。新しいヒビも最初から少し見え、ゲージが増えると伸びる
function crackGrow(it, gauge) { return clamp(0.3 + (gauge - it.g0) * 3.2, 0, 1); }

function crackLength(set, gauge) {
  let s = 0;
  for (const it of set.items) {
    const g = crackGrow(it, gauge);
    s += polyLen2(it.pts) * g;
    for (const b of it.branches) s += polyLen2(b) * g;

}
// 失敗した瞬間、針の位置から割れ目が走る
function crackBurst(set, x, y, n) {

  set.burst = [];
  for (let i = 0; i < n; i++) {
    const a = base + i * 6.2832 / n + (r() - 0.5) * 0.7;
    const m = crackWalk(r, x, y, a, 7, 0.17, 1.1);
    const k = 2 + Math.floor(r() * 3), p = m.pts[k];

    set.burst.push(m.pts, br.pts);
  }
  return set.burst;
}

// ---------- かけら（割れた菓子を放射状の多角形に分ける）----------
function makeShards(seed, cx, cy, n) {
  const r = rnd((seed * 31 + 5) >>> 0);
  n = n || FX.shards;
  const step = 6.2832 / n, base = r() * 6.2832;
  const rays = [];
  for (let i = 0; i < n; i++) {
    const a = base + i * step + (r() - 0.5) * step * 0.6;
    const ux = Math.cos(a), uy = Math.sin(a);
    const b = cx * ux + cy * uy, t = -b + Math.sqrt(Math.max(0, b * b + 1 - cx * cx - cy * cy));
    const nx = -uy, ny = ux;
    const j1 = (r() - 0.5) * 0.09, j2 = (r() - 0.5) * 0.09;
    rays.push({
      pts: [[cx + ux * t * 0.35 + nx * j1, cy + uy * t * 0.35 + ny * j1], [cx + ux * t * 0.7 + nx * j2, cy + uy * t * 0.7 + ny * j2], [cx + ux * t, cy + uy * t]],
    });
  }

  for (let i = 0; i < n; i++) {
    const A = rays[i].pts, B = rays[(i + 1) % n].pts;
    const poly = [[cx, cy], A[0], A[1], A[2]];
    const a0 = Math.atan2(A[2][1], A[2][0]);
    let a1 = Math.atan2(B[2][1], B[2][0]);
    if (a1 <= a0) a1 += 6.2832;
    for (let k = 1; k <= 3; k++) { const a = a0 + (a1 - a0) * k / 4; poly.push([Math.cos(a), Math.sin(a)]); }

    for (const p of poly) { mx += p[0]; my += p[1]; }
    mx /= poly.length; my /= poly.length;

      poly, cx: mx, cy: my, area: polyArea(poly),
      vx: mx * 0.55 + (r() - 0.5) * 0.5, vy: -0.15 - r() * 0.55, w: (r() - 0.5) * 6,
    });

}
function shardPos(s, t) { return { dx: s.vx * t, dy: s.vy * t + 0.5 * FX.gravity * t * t, rot: s.w * t }; }

// ---------- 粉 ----------
function spawnPowder(seed, src, n) {
  const r = rnd((seed * 17 + 3) >>> 0), out = [];
  if (!src || !src.length) return out;
  for (let i = 0; i < n; i++) {
    const p = src[Math.floor(r() * src.length)];
    out.push({ x: p[0], y: p[1], vx: (r() - 0.5) * 0.5, vy: -(0.12 + r() * 0.5), life: 0.6 + r() * 0.6, age: 0, size: 0.005 + r() * 0.011, c: r() < 0.5 ? 0 : 1 });
  }
  return out;
}
function stepPowder(list, dt) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.7 * dt;
    if (p.age >= p.life) list.splice(i, 1);
  }
}

// ---------- 緊張感 ----------
// 心音の間隔(秒)。ヒビが少ないうちは null（鳴らさない）
function heartInterval(crack) {
  if (!(crack >= FX.heartFrom)) return null;
  const t = clamp((crack - FX.heartFrom) / (1 - FX.heartFrom), 0, 1);
  return FX.heartSlow + (FX.heartFast - FX.heartSlow) * t;
}
function vignetteAlpha(crack) {
  if (!(crack > FX.vigFrom)) return 0;
  return clamp((crack - FX.vigFrom) / (1 - FX.vigFrom), 0, 1) * FX.vigMax;
}
// 部品の浮き上がり具合 0..1（なめらかに減速）
function liftAmount(t) {
  if (!(t > 0)) return 0;
  if (t >= FX.liftSec) return 1;
  const u = 1 - t / FX.liftSec;
  return 1 - u * u * u;
}
// 失敗からの経過秒 el での画面の揺れの大きさ(px)
function shakeAmp(el, reduced) {
  if (!(el >= 0) || el >= FX.shakeSec) return 0;

}
function newFx(seed) {

}

// ===== 文字 → 型（キャンバスに描いて読み取る。verify.html でも使う）=====
const GLYPH = { cache: new Map(), refs: null, canvas: null };

function glyphFont() { return CFG.glyph.weight + ' ' + CFG.glyph.fontPx + 'px ' + CFG.glyph.families.join(','); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Web フォントを待つ（読めなくても先に進む）
async function loadGlyphFonts(text) {
  if (!(document.fonts && document.fonts.load)) return;
  const jobs = ['"M PLUS Rounded 1c"', '"Zen Maru Gothic"'].map(f =>
    Promise.race([document.fonts.load(CFG.glyph.weight + ' 100px ' + f, text).catch(() => []), sleep(CFG.glyph.fontTimeoutMs)]));
  try { await Promise.all(jobs); } catch (e) { /* 端末のフォントで続行 */ }
}

// 文字を描いて {mask(0..1), ink(画素数), colored(色つき=絵文字)} を返す
function rasterizeChar(ch, extraStroke) {
  const N = CFG.glyph.size;
  let cv = GLYPH.canvas;
  if (!cv) { cv = GLYPH.canvas = document.createElement('canvas'); cv.width = cv.height = N; }
  const c = cv.getContext('2d', { willReadFrequently: true });
  c.fillStyle = '#fff'; c.fillRect(0, 0, N, N);
  c.fillStyle = '#000'; c.strokeStyle = '#000';
  c.font = glyphFont();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; const lw = CFG.glyph.stroke + (extraStroke || 0);
  c.lineWidth = lw;
  c.fillText(ch, N / 2, N / 2 + CFG.glyph.fontPx * 0.04);
  if (lw > 0) c.strokeText(ch, N / 2, N / 2 + CFG.glyph.fontPx * 0.04);
  const im = c.getImageData(0, 0, N, N).data;
  const mask = new Float32Array(N * N);
  let ink = 0, colored = 0;
  for (let i = 0; i < N * N; i++) {
    const r = im[4 * i], g = im[4 * i + 1], b = im[4 * i + 2];
    const v = 1 - (r + g + b) / 765;
    mask[i] = v;
    if (v > 0.5) ink++;
    if (Math.max(r, g, b) - Math.min(r, g, b) > 40) colored++;
  }
  return { mask, ink, colored: colored > 30, W: N, H: N };
}

// 文字が「豆腐（フォントに無い）」かどうか: 存在しない文字の描画と同じなら未対応
function glyphMissing(r) {
  if (!GLYPH.refs) GLYPH.refs = ['\u{10FFFF}', '￿', '\u{F0001}'].map(rasterizeChar);
  for (const ref of GLYPH.refs) {
    if (ref.ink < 50) continue;
    let diff = 0, uni = 0;
    for (let i = 0; i < r.mask.length; i++) {
      const a = r.mask[i] > 0.5, b = ref.mask[i] > 0.5;
      if (a || b) { uni++; if (a !== b) diff++; }
    }
    if (uni > 0 && diff / uni < 0.02) return true;
  }
  return false;
}

// 1 文字 → { ok, shape } か { ok:false, kind:'unsupported'|'toohard', msg }
function makeShapeSync(ch) {
  if (GLYPH.cache.has(ch)) return GLYPH.cache.get(ch);
  let res;
  const bad = { ok: false, kind: 'unsupported', ch, msg: 'この文字は型にできません：「' + ch + '」' };
  if (EMOJI_RE.test(ch)) res = bad;
  else {
    const r = rasterizeChar(ch);
    if (r.ink < 80 || r.colored || glyphMissing(r)) res = bad;
    else {
      let shape = buildShape(r.mask, r.W, r.H);
      // 細い線の記号（♡☆ など）は、溝が重ならないよう太らせて作り直す
      if (shape.ok && shape.thickness < CFG.glyph.minThickness && shape.nLoops <= 4) {
        for (const extra of [10, 18, 26, 34]) {
          const r2 = rasterizeChar(ch, extra);
          const s2 = buildShape(r2.mask, r2.W, r2.H);
          if (!s2.ok) break;
          shape = s2;
          if (s2.thickness >= CFG.glyph.minThickness) break;
        }
      }
      if (!shape.ok || shape.nParts === 0) res = bad;
      else if (shape.tooHard) res = { ok: false, kind: 'toohard', ch, shape, msg: '難しすぎます：「' + ch + '」' };
      else res = { ok: true, ch, shape };
    }
  }
  GLYPH.cache.set(ch, res);
  return res;
}
async function makeShape(ch) {
  if (!GLYPH.cache.has(ch)) await loadGlyphFonts(ch);
  return makeShapeSync(ch);
}

// ===== 描画（砂糖菓子・溝・針・演出）=====
const CANDY = [
  { fill: '#ffc6da', rim: '#eb97b5', hi: '#ffe9f1', groove: 'rgba(150,60,100,.55)', cutc: '#fffafc', tint: '120,50,85' },
  { fill: '#bfe2ff', rim: '#8cbfe8', hi: '#e6f4ff', groove: 'rgba(50,90,150,.5)', cutc: '#fbfdff', tint: '40,70,125' },
  { fill: '#fff0a6', rim: '#e8cf6a', hi: '#fffadc', groove: 'rgba(150,115,30,.5)', cutc: '#fffef6', tint: '130,100,25' },
  { fill: '#c6f0d8', rim: '#8fd1ae', hi: '#eafaf1', groove: 'rgba(40,120,85,.5)', cutc: '#fbfffd', tint: '35,100,70' },
  { fill: '#e0cdf7', rim: '#b79ee0', hi: '#f4ecff', groove: 'rgba(100,70,160,.5)', cutc: '#fdfaff', tint: '85,55,140' },
  { fill: '#ffd9bf', rim: '#eeb08a', hi: '#fff0e4', groove: 'rgba(160,90,45,.5)', cutc: '#fffaf5', tint: '140,75,35' },
];
const G = {
  session: null, shape: null, dig: null, P: null, color: CANDY[0], char: '',
  needle: { x: 0, y: 0, vis: false }, touch: false,
  over: false, view: { w: 300, h: 300, cx: 150, cy: 150, R: 140, dpr: 1 },
  failAt: 0, seed: 1, anim: 0,
  tex: null, paths: null, fx: null,
};

function loopPath(ctx, l) {
  const p = l.pts, n = l.n;
  ctx.moveTo(p[0], p[1]);
  for (let i = 1; i < n; i++) ctx.lineTo(p[2 * i], p[2 * i + 1]);
  ctx.closePath();
}

// 砂糖菓子の質感を 1 枚のキャンバスに焼く（菓子ごとに 1 回。毎フレームは drawImage だけ）
// 座標は「半径 = 1」で、-1.08..1.08 を 1 枚に収める
const TEX_SPAN = 1.08;
function bakeCandy(col, seed, R, dpr) {
  const px = Math.min(900, Math.max(160, Math.round(2 * TEX_SPAN * R * dpr)));
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const x = c.getContext('2d', { willReadFrequently: true });
  const u = px / (2 * TEX_SPAN);
  x.translate(px / 2, px / 2); x.scale(u, u);
  const r = rnd((seed ^ 0x9e3779b9) >>> 0);
  const TAU = 6.2832;
  x.save();
  x.beginPath(); x.arc(0, 0, 1, 0, TAU); x.clip();
  // 下地
  const g = x.createRadialGradient(-0.3, -0.35, 0.1, 0, 0, 1.05);
  g.addColorStop(0, col.hi); g.addColorStop(1, col.fill);
  x.fillStyle = g; x.fillRect(-1.1, -1.1, 2.2, 2.2);
  // ほんのりした凹凸（大きなやわらかい明暗）
  for (let k = 0; k < 16; k++) {
    const a = r() * TAU, d = Math.sqrt(r()) * 0.9, bx = Math.cos(a) * d, by = Math.sin(a) * d, br = 0.18 + r() * 0.3;
    const lg = x.createRadialGradient(bx, by, 0, bx, by, br);
    const light = k % 2 === 0;
    lg.addColorStop(0, light ? 'rgba(255,255,255,.26)' : 'rgba(' + col.tint + ',.10)');
    lg.addColorStop(1, light ? 'rgba(255,255,255,0)' : 'rgba(' + col.tint + ',0)');
    x.fillStyle = lg; x.fillRect(bx - br, by - br, br * 2, br * 2);
  }
  // 粒（砂糖のつぶ）
  const nDot = Math.min(2400, Math.round(R * dpr * 6));
  for (let k = 0; k < nDot; k++) {
    const a = r() * TAU, d = Math.sqrt(r()) * 1.0, sx = Math.cos(a) * d, sy = Math.sin(a) * d;
    const rad = 0.003 + r() * 0.0065;
    x.fillStyle = r() < 0.55 ? 'rgba(255,255,255,.65)' : 'rgba(' + col.tint + ',.22)';
    x.beginPath(); x.arc(sx, sy, rad, 0, TAU); x.fill();
  }
  x.restore();
  // 縁の厚み（外の輪、明るい面取り、影側の面取り）
  x.lineWidth = 0.05; x.strokeStyle = col.rim;
  x.beginPath(); x.arc(0, 0, 0.975, 0, TAU); x.stroke();
  const lgA = x.createLinearGradient(-0.7, -0.7, 0.7, 0.7);
  lgA.addColorStop(0, 'rgba(255,255,255,.95)'); lgA.addColorStop(0.6, 'rgba(255,255,255,0)');
  x.lineWidth = 0.022; x.strokeStyle = lgA;
  x.beginPath(); x.arc(0, 0, 0.94, 0, TAU); x.stroke();
  const lgB = x.createLinearGradient(-0.7, -0.7, 0.7, 0.7);
  lgB.addColorStop(0.4, 'rgba(' + col.tint + ',0)'); lgB.addColorStop(1, 'rgba(' + col.tint + ',.5)');
  x.lineWidth = 0.024; x.strokeStyle = lgB;
  x.beginPath(); x.arc(0, 0, 0.99, 0, TAU); x.stroke();
  // ざらつき（細かい明暗ノイズ。縁の外の透明部分は触らない）
  const im = x.getImageData(0, 0, px, px), d = im.data;
  let s = ((seed * 2654435761) >>> 0) || 1;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    s = (s * 1664525 + 1013904223) >>> 0;
    const n = ((s >>> 24) - 128) * 0.15;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(im, 0, 0);
  return c;
}

// 型の各部品の輪郭を Path2D にしておく
function buildPaths(shape) {
  return shape.parts.map(part => {
    const p = new Path2D();
    for (const l of part.loops) loopPath(p, l);
    return p;
  });
}

// 折れ線を、全長の frac だけ描く（ヒビが伸びる表示）
function tracePoly(ctx, pts, frac) {
  if (frac <= 0 || pts.length < 2) return;
  let total = 0;
  for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  let left = total * Math.min(1, frac);
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const a = pts[i - 1], b = pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (l <= left) { ctx.lineTo(b[0], b[1]); left -= l; }
    else { const k = left / l; ctx.lineTo(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k); left = 0; }
  }
}
function drawCrackLines(ctx, lines) {
  // lines: [{pts, frac}]
  if (!lines.length) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.save();
  ctx.translate(0.005, 0.005);
  ctx.beginPath(); for (const L of lines) tracePoly(ctx, L.pts, L.frac);
  ctx.lineWidth = 0.011; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.stroke();
  ctx.restore();
  ctx.beginPath(); for (const L of lines) tracePoly(ctx, L.pts, L.frac);
  ctx.lineWidth = 0.0075; ctx.strokeStyle = 'rgba(70,25,45,.9)'; ctx.stroke();
}

// 砂糖菓子の本体（板・溝・外れた部品・ヒビ）。単位空間（半径 = 1）で描く
function drawBody(ctx, now) {
  const dig = G.dig, P = G.P, col = G.color, shape = G.shape, fx = G.fx;
  const dpr = G.view.dpr;
  ctx.drawImage(G.tex, -TEX_SPAN, -TEX_SPAN, TEX_SPAN * 2, TEX_SPAN * 2);
  // 溝（影・ハイライト・本体）
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const gw = P.safe * 2;
  shape.parts.forEach((part, pi) => {
    if (dig.partDone[pi]) return;
    const path = G.paths[pi];
    ctx.save();
    ctx.translate(0.011, 0.011);
    ctx.lineWidth = gw * 0.95; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.stroke(path);   // 下側の縁に光
    ctx.restore();
    ctx.lineWidth = gw; ctx.strokeStyle = col.groove; ctx.stroke(path);
    ctx.save();
    ctx.translate(-0.004, -0.004);
    ctx.lineWidth = gw * 0.5; ctx.strokeStyle = 'rgba(' + col.tint + ',.28)'; ctx.stroke(path); // 上側の壁の影
    ctx.restore();
    // 切れた溝（明るく）
    ctx.beginPath();
    for (const l of part.loops) {
      const c = dig.cut[l.id], p = l.pts, n = l.n;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        if (c[i] && c[j]) { ctx.moveTo(p[2 * i], p[2 * i + 1]); ctx.lineTo(p[2 * j], p[2 * j + 1]); }
      }
    }
    ctx.lineWidth = gw * 0.78; ctx.strokeStyle = col.cutc; ctx.stroke();
  });
  // 外れた部品（少し浮いて持ち上がる）
  const reduced = reducedMotion();
  shape.parts.forEach((part, pi) => {
    if (!dig.partDone[pi]) return;
    const path = G.paths[pi];
    const el = now - (fx.partT[pi] === undefined ? -9 : fx.partT[pi]);
    const lift = liftAmount(el);
    const hover = (lift >= 1 && !reduced) ? Math.sin(el * 3.2) * 0.004 : 0;
    // 抜けたあとの穴
    ctx.fillStyle = 'rgba(' + col.tint + ',.32)'; ctx.fill(path, 'evenodd');
    ctx.save();
    ctx.translate(-0.035 * lift, -0.055 * lift - hover);
    ctx.scale(1 + 0.025 * lift, 1 + 0.025 * lift);
    ctx.shadowColor = 'rgba(90,40,60,.45)'; ctx.shadowBlur = (4 + 10 * lift) * dpr; ctx.shadowOffsetY = (2 + 6 * lift) * dpr;
    ctx.fillStyle = col.hi; ctx.fill(path, 'evenodd');
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.save();
    ctx.clip(path, 'evenodd');
    ctx.drawImage(G.tex, -TEX_SPAN, -TEX_SPAN, TEX_SPAN * 2, TEX_SPAN * 2);
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(-1.1, -1.1, 2.2, 2.2);
    ctx.restore();
    ctx.lineWidth = 0.012; ctx.strokeStyle = col.rim; ctx.stroke(path);
    ctx.restore();
  });
  // ヒビ（ゲージに応じて本数と長さが増える）＋失敗時の割れ目
  const lines = [];
  for (const it of fx.cracks.items) {
    const f = crackGrow(it, dig.crack);
    lines.push({ pts: it.pts, frac: f });
    for (const b of it.branches) lines.push({ pts: b, frac: f });
  }
  if (fx.failT >= 0) {
    const f = clamp((now - fx.failT) / FX.shatterAt, 0, 1);
    for (const b of fx.cracks.burst) lines.push({ pts: b, frac: f });
  }
  drawCrackLines(ctx, lines);
}

// 割れた瞬間の絵を 1 枚に撮って、かけら（多角形）に分ける
function buildShatter(now) {
  const fx = G.fx, fp = G.dig.failPos || { x: 0, y: 0 };
  const px = G.tex.width;
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const x = c.getContext('2d');
  const u = px / (2 * TEX_SPAN);
  x.translate(px / 2, px / 2); x.scale(u, u);
  drawBody(x, now);
  fx.snap = c;
  const cx = clamp(fp.x, -0.7, 0.7), cy = clamp(fp.y, -0.7, 0.7);
  fx.shards = makeShards(G.seed, cx, cy, FX.shards);
}

function drawGame(ctx) {
  const v = G.view;
  ctx.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
  ctx.clearRect(0, 0, v.w, v.h);
  if (!G.shape || !G.dig || !G.tex || !G.fx) return;
  const dig = G.dig, P = G.P, fx = G.fx, now = G.anim;
  const failEl = fx.failT >= 0 ? now - fx.failT : -1;
  // 画面の揺れ（割れた直後の短い間）
  const amp = shakeAmp(failEl, reducedMotion());
  if (amp > 0) {
    const sx = (Math.random() - 0.5) * 2 * amp, sy = (Math.random() - 0.5) * 2 * amp;
    ctx.setTransform(v.dpr, 0, 0, v.dpr, sx * v.dpr, sy * v.dpr);
  }
  ctx.save();
  ctx.translate(v.cx, v.cy);
  ctx.scale(v.R, v.R);
  if (fx.failT >= 0 && failEl >= FX.shatterAt) {
    // かけらが回転しながら落ちる
    if (!fx.shards) buildShatter(now);
    const t = failEl - FX.shatterAt;
    const alpha = clamp(1 - (t - 0.75) / 0.45, 0, 1);
    ctx.globalAlpha = alpha;
    for (const s of fx.shards) {
      const q = shardPos(s, t);
      ctx.save();
      ctx.translate(s.cx + q.dx, s.cy + q.dy);
      ctx.rotate(q.rot);
      ctx.translate(-s.cx, -s.cy);
      ctx.beginPath();
      ctx.moveTo(s.poly[0][0], s.poly[0][1]);
      for (let i = 1; i < s.poly.length; i++) ctx.lineTo(s.poly[i][0], s.poly[i][1]);
      ctx.closePath();
      ctx.shadowColor = 'rgba(90,40,60,.35)'; ctx.shadowBlur = 5 * v.dpr; ctx.shadowOffsetY = 2 * v.dpr;
      ctx.fillStyle = G.color.fill; ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.clip();
      ctx.drawImage(fx.snap, -TEX_SPAN, -TEX_SPAN, TEX_SPAN * 2, TEX_SPAN * 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  } else {
    // 影
    ctx.beginPath(); ctx.arc(0.02, 0.045, 1, 0, 6.2832); ctx.fillStyle = 'rgba(90,40,60,.18)'; ctx.fill();
    drawBody(ctx, now);
    // 切り残しのヒント
    const hints = (G.over || dig.failed || dig.cleared) ? [] : dig.hints();
    if (hints.length) {
      const a = 0.5 + 0.35 * Math.sin(G.anim * 7);
      ctx.fillStyle = 'rgba(255,215,0,' + a.toFixed(2) + ')';
      ctx.beginPath();
      for (const h of hints) { ctx.moveTo(h[0] + 0.03, h[1]); ctx.arc(h[0], h[1], 0.03, 0, 6.2832); }
      ctx.fill();
    }
  }
  // 粉
  if (fx.powder.length) {
    const col = G.color;
    for (let c = 0; c < 2; c++) {
      ctx.beginPath();
      for (const p of fx.powder) if (p.c === c) { ctx.moveTo(p.x + p.size, p.y); ctx.arc(p.x, p.y, p.size, 0, 6.2832); }
      ctx.fillStyle = c === 0 ? 'rgba(255,255,255,.85)' : col.hi;
      ctx.globalAlpha = 0.85;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // 針（px 座標）
  const nd = G.needle;
  if (nd.vis && !dig.failed) {
    const x = v.cx + nd.x * v.R, y = v.cy + nd.y * v.R;
    ctx.save();
    ctx.translate(x, y);
    ctx.lineCap = 'round';
    // 安全な幅の目安（ごく薄く）
    ctx.beginPath(); ctx.arc(0, 0, P.safe * v.R, 0, 6.2832);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 4; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3;
    const lg = ctx.createLinearGradient(0, 0, 26, -34);
    lg.addColorStop(0, '#8b949c'); lg.addColorStop(0.5, '#f4f7fa'); lg.addColorStop(1, '#a5aeb6');
    ctx.strokeStyle = lg; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(24, -32); ctx.stroke();
    ctx.shadowColor = 'transparent';
    ctx.beginPath(); ctx.arc(26, -35, 4.2, 0, 6.2832); ctx.fillStyle = dig.down ? '#e0608a' : '#c9d0d6'; ctx.fill();
    ctx.restore();
  }
}

// ===== 効果音（WebAudio で生成。外部素材なし）=====
const MUTE_KEY = 'mojiKatanuki.mute';
function loadMuted(st) { try { return !!st && st.getItem(MUTE_KEY) === '1'; } catch (_) { return false; } }
function saveMuted(st, v) { try { if (!st) return false; st.setItem(MUTE_KEY, v ? '1' : '0'); return true; } catch (_) { return false; } }
function getStorage() { try { return window.localStorage || null; } catch (_) { return null; } }

const SFX = {
  ctx: null, master: null, noiseBuf: null, scr: null,
  muted: loadMuted(getStorage()),
  // 最初のユーザー操作で呼ぶ（何度呼んでもよい）
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.9;
        this.master.connect(this.ctx.destination);
        const n = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = b;
      }
      if (this.ctx.state === 'suspended') { const p = this.ctx.resume(); if (p && p.catch) p.catch(() => { }); }
    } catch (_) { this.ctx = null; }
  },
  setMuted(v) {
    this.muted = !!v;
    saveMuted(getStorage(), this.muted);
    if (this.master) { try { this.master.gain.setTargetAtTime(this.muted ? 0 : 0.9, this.ctx.currentTime, 0.02); } catch (_) { } }
    if (this.muted) this.scrapeStop();
  },
  on() { return !!(this.ctx && !this.muted && this.ctx.state === 'running'); },
  tone(f0, f1, t0, dur, vol, type) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.01, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(t0, dur, vol, type, f0, f1, q) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf;
    f.type = type; f.Q.value = q || 0.8;
    f.frequency.setValueAtTime(f0, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.008, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t0, Math.random() * 1.5); s.stop(t0 + dur + 0.02);
  },
  // 削る音：動かしている間だけ鳴るノイズ。速さで高さと大きさが変わる
  scrapeStart() {
    if (!this.on() || this.scr) return;
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; s.loop = true;
    f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 1.2;
    g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start();
    this.scr = { s, f, g };
  },
  // ratio: 速さ / 速度上限（0 で止まっている）。edge: フチ（ヒビが入っている）か
  scrapeSet(ratio, edge) {
    const r = this.scr;
    if (!r || !this.ctx) return;
    const k = clamp(ratio, 0, 1.4), t = this.ctx.currentTime;
    const vol = k < 0.02 ? 0 : (0.02 + 0.07 * Math.min(1, k)) * (edge ? 1.5 : 1);
    r.g.gain.setTargetAtTime(vol, t, 0.03);
    r.f.frequency.setTargetAtTime(650 + 1700 * k + (edge ? 600 : 0), t, 0.04);
    r.f.Q.setTargetAtTime(edge ? 3 : 1.2, t, 0.05);
  },
  scrapeStop() {
    const r = this.scr;
    if (!r) return;
    this.scr = null;
    try {
      r.g.gain.setTargetAtTime(0, this.ctx.currentTime, 0.02);
      r.s.stop(this.ctx.currentTime + 0.15);
    } catch (_) { }
  },
  crack() {
    if (!this.on()) return;
    const t = this.ctx.currentTime;
    this.noise(t, 0.06, 0.28, 'highpass', 3200, 5000, 0.7);
    this.tone(2100, 900, t, 0.06, 0.1, 'triangle');
  },
  shatter() {
    if (!this.on()) return;
    const t = this.ctx.currentTime;
    this.scrapeStop();
    this.noise(t, 0.5, 0.55, 'lowpass', 7000, 500, 0.7);
    this.tone(170, 48, t, 0.3, 0.55, 'sine');
    for (let i = 0; i < 7; i++) this.noise(t + 0.03 + Math.random() * 0.4, 0.04, 0.22, 'highpass', 2500 + Math.random() * 3000, null, 0.8);
  },
  part() {
    if (!this.on()) return;
    const t = this.ctx.currentTime;
    this.tone(440, 880, t, 0.13, 0.22, 'sine');
    this.tone(660, 1320, t + 0.05, 0.14, 0.15, 'sine');
    this.noise(t, 0.18, 0.1, 'bandpass', 2600, 1800, 1);
  },
  rank(rank) {
    if (!this.on()) return;
    const t = this.ctx.currentTime;
    const seq = { S: [523, 659, 784, 1047], A: [392, 523, 659], B: [392, 523], C: [330] }[rank];
    if (!seq) return;
    seq.forEach((f, i) => this.tone(f, f, t + i * 0.11, 0.28, 0.2, 'triangle'));
    if (rank === 'S') for (let i = 0; i < 4; i++) this.tone(2093 + i * 260, 2093 + i * 260, t + 0.45 + i * 0.07, 0.18, 0.07, 'sine');
  },
  // 心音。strength: 0..1（ヒビが多いほど強く）
  heart(strength) {
    if (!this.on()) return;
    const t = this.ctx.currentTime, v = 0.22 + 0.4 * clamp(strength, 0, 1);
    this.tone(78, 42, t, 0.14, v, 'sine');
    this.tone(70, 40, t + 0.17, 0.14, v * 0.7, 'sine');
  },
};

// ===== 記録と「あそびかた」既読の保存（純ロジック。localStorage は引数で受け取る）=====
const REC_KEY = 'mojiKatanuki.record';
const HOWTO_KEY = 'mojiKatanuki.howto';
const REC_MAX_CHARS = 300;          // 記録する文字の上限（超えたら挑戦回数の少ない順に捨てる）
const RANK_ORDER = { S: 4, A: 3, B: 2, C: 1 };

function emptyRecord() { return { v: 1, total: 0, chars: {} }; }

// 保存された値を安全に読み直す（壊れていても空の記録にする）
function sanitizeRecord(o) {
  const r = emptyRecord();
  if (!o || typeof o !== 'object') return r;
  if (Number.isFinite(o.total) && o.total > 0) r.total = Math.floor(o.total);
  if (o.chars && typeof o.chars === 'object') {
    for (const k of Object.keys(o.chars)) {
      const c = o.chars[k];
      if (!c || typeof c !== 'object' || Array.from(k).length !== 1) continue;
      const tries = Number.isFinite(c.tries) && c.tries > 0 ? Math.floor(c.tries) : 0;
      const clears = Number.isFinite(c.clears) && c.clears > 0 ? Math.min(Math.floor(c.clears), tries) : 0;
      const hasBest = Number.isFinite(c.best) && c.best >= 0 && RANK_ORDER[c.rank];
      r.chars[k] = { tries, clears, best: hasBest ? Math.round(c.best) : null, rank: hasBest ? c.rank : null,
        stars: Number.isFinite(c.stars) ? clamp(Math.round(c.stars), 1, 5) : 1, last: Number.isFinite(c.last) ? c.last : 0 };
    }
  }
  return r;
}

// 1 回の挑戦を記録に加える（元の記録は変えずに新しい記録を返す）
// ok: 成功したか / sc: スコア結果（{total, rank}）/ now: 通し番号（新しい順の並びに使う）
function recordAttempt(rec, ch, ok, sc, stars, now) {
  const r = sanitizeRecord(rec);
  const old = r.chars[ch];
  const c = old ? Object.assign({}, old) : { tries: 0, clears: 0, best: null, rank: null, stars: 1, last: 0 };
  c.tries++;
  c.stars = clamp(Math.round(stars || 1), 1, 5);
  c.last = now || r.total + 1;
  let newBest = false;
  if (ok && sc) {
    c.clears++;
    if (c.best === null || sc.total > c.best) {
      newBest = c.best !== null;          // 初めての成功は「更新」ではない
      c.best = sc.total; c.rank = sc.rank;
    }
  }
  r.chars[ch] = c;
  r.total++;
  const keys = Object.keys(r.chars);
  if (keys.length > REC_MAX_CHARS) {
    keys.sort((a, b) => r.chars[a].last - r.chars[b].last);
    for (let i = 0; i < keys.length - REC_MAX_CHARS; i++) delete r.chars[keys[i]];
  }
  return { rec: r, newBest, first: !old || old.best === null && ok, entry: c };
}

// きろく画面の並び（挑戦した文字を、最近挑戦した順に）
function recordList(rec) {
  const r = sanitizeRecord(rec);
  return Object.keys(r.chars).map(ch => Object.assign({ ch }, r.chars[ch])).sort((a, b) => b.last - a.last);
}

function loadRecord(st) {
  try { return st ? sanitizeRecord(JSON.parse(st.getItem(REC_KEY))) : emptyRecord(); } catch (_) { return emptyRecord(); }
}
function saveRecord(st, rec) {
  try { if (!st) return false; st.setItem(REC_KEY, JSON.stringify(rec)); return true; } catch (_) { return false; }
}
function clearRecord(st) {
  try { if (!st) return false; st.removeItem(REC_KEY); return true; } catch (_) { return false; }
}
function loadHowtoSeen(st) { try { return !!st && st.getItem(HOWTO_KEY) === '1'; } catch (_) { return false; } }
function saveHowtoSeen(st) { try { if (!st) return false; st.setItem(HOWTO_KEY, '1'); return true; } catch (_) { return false; } }

// ===== 画面・操作・進行 =====
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 文節ごとに inline-block の span で包む（'|' が文節の区切り）。言葉の途中では改行されない
function wrapPhrases(text) {
  return String(text).split('|').map(s => '<span class="ph">' + esc(s) + '</span>').join('');
}
function setPh(el, text) { el.innerHTML = wrapPhrases(text); }

const SCREENS = ['scTitle', 'scHow', 'scSelect', 'scRec', 'scGame', 'scResult'];
function show(id) {
  for (const s of SCREENS) $(s).classList.toggle('on', s === id);
  G.screen = id;
